<style>
  :root{
    --bg:#f4f6f6;
    --panel:#ffffff;
    --ink:#15191e;
    --muted:#5f6a72;
    --line:#e2e7e8;
    --accent:#0f5e5a;
    --accent-soft:#e4efee;
    --radius:14px;
    --maxw:840px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;

  a{color:var(--accent)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

  /* nav */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(244,246,246,.85);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav .wrap{display:flex;align-items:center;gap:18px;height:60px}
  .nav .brand{font-weight:650;letter-spacing:-.01em;text-decoration:none;color:var(--ink);margin-right:auto;font-size:1.02rem}
  .nav a.link{text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:500;transition:color .15s}
  .nav a.link:hover{color:var(--accent)}
  @media (max-width:620px){ .nav a.link{display:none} }

  /* hero */
  .hero{padding:54px 0 12px}
  .hero .row{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .avatar{
    width:128px;height:128px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:4px solid var(--panel);box-shadow:0 4px 18px rgba(21,25,30,.14);
  }
  .hero h1{font-size:2.1rem;font-weight:680;letter-spacing:-.02em;margin:0 0 4px}
  .hero .ttl{margin:0;font-size:1.05rem}
  .hero .aff{margin:3px 0 0;color:var(--muted);font-size:.92rem}
  .hero .loc{margin:2px 0 0;color:var(--muted);font-size:.86rem}
  .tagline{margin:22px 0 0;font-size:1.12rem;color:var(--ink);max-width:62ch}

  /* quick links */
  .quick{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 4px}
  .quick a{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:500;
    transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  .quick a:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,94,90,.10)}
  .quick svg{width:17px;height:17px;fill:var(--accent)}

  /* sections */
  section{padding:40px 0;border-top:1px solid var(--line)}
  section:first-of-type{border-top:none}
  h2{font-size:1.0rem;text-transform:uppercase;letter-spacing:.10em;color:var(--accent);margin:0 0 18px;font-weight:680}
  section p{margin:0 0 14px;max-width:70ch}

  /* interests */
  .tags{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0}
  .tags li{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:7px 13px;font-size:.9rem;font-weight:500}

  /* publications */
  .pub{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
  .pub:last-child{border-bottom:none}
  .pub .yr{flex:0 0 48px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:2px}
  .pub .body{flex:1}
  .pub .t{font-weight:600;margin:0 0 3px}
  .pub .a{color:var(--muted);font-size:.9rem;margin:0 0 2px}
  .pub .v{font-style:italic;color:var(--muted);font-size:.9rem;margin:0 0 8px}
  .pub .pl{display:flex;flex-wrap:wrap;gap:8px}
  .pub .pl a{
    text-decoration:none;font-size:.78rem;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:3px 9px;transition:background .15s,color .15s;
  }
  .pub .pl a:hover{background:var(--accent);color:#fff}

  /* projects */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .proj{
    display:block;text-decoration:none;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;
    transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  .proj:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,94,90,.10)}
  .proj .pn{font-weight:650;margin:0 0 6px}
  .proj .pb{color:var(--muted);font-size:.9rem;margin:0}

  /* contact + footer */
  .social{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .social a{
    width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);border-radius:10px;
    transition:background .15s,color .15s,transform .15s;
  }
  .social a:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
  .social svg{width:20px;height:20px;fill:currentColor}
  footer{padding:30px 0 50px;color:var(--muted);font-size:.8rem;text-align:center;border-top:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

    a.innerHTML = '<p class="pn">'+p.name+'</p><p class="pb">'+p.blurb+'</p>';
    projs.appendChild(a);
  });
  if(!(SITE.projects||[]).length) document.getElementById("projects").remove();

  // contact
  const email = (SITE.links||[]).find(function(l){return l.tag==="EMAIL";});
  document.getElementById("js-contact-line").innerHTML =
    "Best reached by email" + (email ? ' at <a href="'+email.url+'">'+email.url.replace("mailto:","")+'</a>' : "") +
    (SITE.location ? ". Based in "+SITE.location+"." : ".");
  const social = document.getElementById("js-social");
  (SITE.links||[]).forEach(function(l){
    const a = el('<a></a>');
    a.href = l.url; a.title = l.label; a.setAttribute("aria-label", l.label);
    if(ext(l.url)){ a.target="_blank"; a.rel="noopener"; }
    a.innerHTML = icon(l.tag);
    social.appendChild(a);
  });
</script>
</body>
</html>
